# Route ferros3's syslog output to its own file.
#
# Installed as /etc/syslog.d/ferros3.conf — /etc/syslog.conf already carries
# "include /etc/syslog.d", so no edit to the main config is needed.
#
# The program filter matches the -T tag that the rc.d script passes to daemon(8).
!ferros3
*.*						/var/log/ferros3.log

# Rotate ferros3's log. Installed as /usr/local/etc/newsyslog.conf.d/ferros3.conf.
#
# Rotation works here because syslogd owns the file: newsyslog renames it and HUPs
# syslogd, which reopens the path. Keep 7 generations, roll at 10 MB, gzip the old ones,
# and create the file if it does not exist yet (C) so the first boot after install has
# somewhere to write.
#
# logfilename          [owner:group]  mode count size(KB)  when  flags
/var/log/ferros3.log   root:wheel     640  7     10240     *     CZ
